      - name: Configure CMake
        run: cmake -S ./Code -B ./build -DBUILD_TESTS=ON -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build ./build --config Release -- -j$(sysctl -n hw.ncpu)
      - name: Test
        run: ctest --test-dir ./build --output-on-failure

#========================================
# Windows cross compile to Arduino using avr-gcc
#
# https://tinusaur.com/guides/avr-gcc-toolchain/
#========================================

  build_windows_avr:
    needs: check_formatting
    runs-on: windows-2022
    name: Windows AVR-GCC Cross Compile
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          .\Scripts\DownloadAvrToolchain.ps1
          .\Scripts\UpdatePathWithAvrToolchain.ps1 -github_ci $true
      - name: Tool versions
        run: |
          avr-gcc --version
          make --version
      - name: Configure CMake
        run: |
          $currentPath = (Get-Location).Path
          cmake -G "Unix Makefiles" -S ./Code -B ./build -DCMAKE_TOOLCHAIN_FILE="$currentPath/Code/CMake/AvrToolchain.cmake" -DAVR_MCU=atmega328p -DF_CPU=16000000L -DAVR_SYSROOT=$currentPath/avr8-gnu-toolchain/avr/ -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build ./build --config Release -- -j
