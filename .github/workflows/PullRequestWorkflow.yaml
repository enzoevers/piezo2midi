      - name: Configure CMake
        run: cmake -S ./Code -B ./build -DBUILD_TESTS=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build ./build --config Release -- -j$(sysctl -n hw.ncpu)
      - name: Test
        run: ctest --test-dir ./build --output-on-failure

#========================================
# Mac (intel) Clang Build
#========================================

  build_mac_intel_clang:
    needs: check_formatting
    runs-on: macos-15-intel
    name: Mac (intel) Clang Build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Clang version
